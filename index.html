<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>LSS D&D Automatisation Addon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #1e2231;
      color: #fff;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      padding: 8px 10px;
      background: #161925;
      border-bottom: 1px solid #2e344b;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      background: #5865f2;
      color: white;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #4752c4; }
    button:disabled { background: #444; cursor: not-allowed; }
    .status {
      font-size: 12px;
      color: #cbd5e1;
      flex: 1;
      min-width: 120px;
    }
    .lss-log {
      background: #0f111a;
      color: #4ade80;
      font-family: monospace;
      font-size: 11px;
      padding: 6px 10px;
      max-height: 75px;
      overflow-y: auto;
      border-bottom: 1px solid #2e344b;
      white-space: pre-wrap;
      word-break: break-all;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="bind-btn" disabled>Привязать фишку</button>
    <button id="cone-btn" disabled>Конус 15 фт</button>
    <div id="status" class="status">Подключение...</div>
  </div>

  <div id="lss-log" class="lss-log">Ожидание событий от Long Story Short...</div>

  <iframe
    id="lss-frame"
    src="https://longstoryshort.app/iframe/characters/list/"
    sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals"
    allow="clipboard-write"
  ></iframe>

  <script type="module">
    import OBR, { buildPath, Command } from "https://esm.sh/@owlbear-rodeo/sdk";

    const TOOL_ID = "com.dnd-helper/tool";
    const MODE_ID = "com.dnd-helper/cone-mode";
    const HALF_ANGLE = Math.atan(0.5);
    const ICON_URL = new URL("icon.svg", window.location.href).href;

    let boundTokenId = null;
    let activeConeLengthPx = 0;
    let casterPos = { x: 0, y: 0 };
    let interactionControl = null;

    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("lss-log");
    const bindBtn = document.getElementById("bind-btn");
    const coneBtn = document.getElementById("cone-btn");

    // --- ПРОСЛУШКА СОБЫТИЙ ОТ LONG STORY SHORT ---
    window.addEventListener("message", (event) => {
      // Принимаем сообщения только от longstoryshort.app
      if (event.origin !== "https://longstoryshort.app") return;

      console.log("LSS Event:", event.data);
      const text = typeof event.data === "string"
        ? event.data
        : JSON.stringify(event.data);

      logEl.textContent = text;
    });

    function getConeCommands(lengthPx, angleRad) {
      const x1 = Math.cos(angleRad - HALF_ANGLE) * lengthPx;
      const y1 = Math.sin(angleRad - HALF_ANGLE) * lengthPx;
      const x2 = Math.cos(angleRad + HALF_ANGLE) * lengthPx;
      const y2 = Math.sin(angleRad + HALF_ANGLE) * lengthPx;

      return [
        [Command.MOVE, 0, 0],
        [Command.LINE, x1, y1],
        [Command.LINE, x2, y2],
        [Command.CLOSE],
      ];
    }

    OBR.onReady(async () => {
      statusEl.textContent = "Готово";
      bindBtn.disabled = false;

      await OBR.tool.create({
        id: TOOL_ID,
        icons: [{ icon: ICON_URL, label: "Прицеливание D&D" }],
      });

      await OBR.tool.createMode({
        id: MODE_ID,
        icons: [{ icon: ICON_URL, label: "Конус", filter: { activeTools: [TOOL_ID] } }],
        async onActivate() {
          const cone = buildPath()
            .commands(getConeCommands(activeConeLengthPx, 0))
            .position(casterPos)
            .fillColor("#ff5500")
            .fillOpacity(0.35)
            .strokeColor("#ff5500")
            .strokeWidth(3)
            .layer("POINTER")
            .build();

          const [update, stop] = await OBR.interaction.startItemInteraction(cone);
          interactionControl = { update, stop };
        },
        onToolMove(_context, event) {
          if (!interactionControl) return;
          const dx = event.pointerPosition.x - casterPos.x;
          const dy = event.pointerPosition.y - casterPos.y;
          const angle = Math.atan2(dy, dx);

          interactionControl.update((item) => {
            item.commands = getConeCommands(activeConeLengthPx, angle);
          });
        },
        async onToolClick(_context, event) {
          if (!interactionControl) return;
          const dx = event.pointerPosition.x - casterPos.x;
          const dy = event.pointerPosition.y - casterPos.y;
          const angle = Math.atan2(dy, dx);

          interactionControl.stop();
          interactionControl = null;

          const finalCone = buildPath()
            .commands(getConeCommands(activeConeLengthPx, angle))
            .position(casterPos)
            .fillColor("#ff5500")
            .fillOpacity(0.35)
            .strokeColor("#ff5500")
            .strokeWidth(3)
            .layer("DRAWING")
            .build();

          await OBR.scene.items.addItems([finalCone]);
          await OBR.tool.activateTool("rodeo.owlbear.tool/move");
          statusEl.textContent = "Конус применён!";
        },
        onDeactivate() {
          if (interactionControl) {
            interactionControl.stop();
            interactionControl = null;
          }
        },
      });

      bindBtn.addEventListener("click", async () => {
        const selection = await OBR.player.getSelection();
        if (!selection || selection.length !== 1) {
          statusEl.textContent = "Выдели 1 фишку!";
          return;
        }
        const items = await OBR.scene.items.getItems(selection);
        boundTokenId = items[0].id;
        statusEl.textContent = `Фишка: ${items[0].name || "ОК"}`;
        coneBtn.disabled = false;
      });

      coneBtn.addEventListener("click", async () => {
        if (!boundTokenId) return;
        const items = await OBR.scene.items.getItems([boundTokenId]);
        if (items.length === 0) {
          statusEl.textContent = "Фишка не найдена";
          return;
        }
        casterPos = items[0].position;

        const dpi = await OBR.scene.grid.getDpi();
        const scale = await OBR.scene.grid.getScale();
        const feetPerCell = scale.parsed.multiplier || 5;
        activeConeLengthPx = (15 / feetPerCell) * dpi;

        statusEl.textContent = "Жми ЛКМ на карте...";
        await OBR.tool.activateTool(TOOL_ID);
        await OBR.tool.activateMode(TOOL_ID, MODE_ID);
      });
    });
  </script>
</body>
</html>
